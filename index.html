<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CGSocial NEXT</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050816;
--card:#0f172a;
--card2:#111827;
--line:#1e293b;
--text:#ffffff;
--sub:#94a3b8;
--accent:#f59e0b;
--accent2:#f97316;
--danger:#ef4444;
--like:#2563eb;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{
background:linear-gradient(180deg,#020617,#0f172a);
color:var(--text);
display:flex;
min-height:100vh;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:240px;
background:rgba(15,23,42,.85);
backdrop-filter:blur(20px);
border-right:1px solid var(--line);
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.logo{
font-size:28px;
font-weight:800;
margin-bottom:15px;
background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.menu-item{
background:transparent;
padding:14px;
border-radius:16px;
cursor:pointer;
transition:.2s;
font-weight:600;
color:#cbd5e1;
}

.menu-item:hover{
background:#1e293b;
transform:translateX(4px);
}

/* MAIN */

.main{
flex:1;
overflow-y:auto;
padding:25px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.status{
font-size:14px;
color:var(--sub);
}

.feed-grid{
display:grid;
grid-template-columns:1fr;
gap:15px;
max-width:700px;
margin:auto;
}

/* CREATE POST */

.create-post{
background:rgba(15,23,42,.8);
backdrop-filter:blur(16px);
border:1px solid var(--line);
padding:18px;
border-radius:24px;
margin-bottom:20px;
box-shadow:0 0 30px rgba(0,0,0,.25);
}

textarea{
width:100%;
resize:none;
border:none;
outline:none;
background:#0b1220;
color:white;
padding:15px;
border-radius:18px;
font-size:15px;
min-height:110px;
margin-bottom:10px;
}

.post-actions{
display:flex;
gap:10px;
align-items:center;
}

.file-label{
background:#1e293b;
padding:12px 16px;
border-radius:14px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:.2s;
}

.file-label:hover{
background:#334155;
}

input[type=file]{
display:none;
}

button{
border:none;
cursor:pointer;
transition:.2s;
font-weight:700;
}

.publish{
background:linear-gradient(90deg,var(--accent),var(--accent2));
padding:12px 18px;
border-radius:14px;
color:black;
margin-left:auto;
}

.publish:hover{
transform:scale(1.04);
}

/* POSTS */

.post{
background:rgba(15,23,42,.85);
backdrop-filter:blur(20px);
border:1px solid var(--line);
border-radius:24px;
padding:18px;
animation:show .25s ease;
box-shadow:0 0 25px rgba(0,0,0,.2);
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:none;
}
}

.post-top{
display:flex;
align-items:center;
gap:12px;
margin-bottom:12px;
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
overflow:hidden;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:20px;
color:black;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
display:flex;
flex-direction:column;
}

.username{
font-weight:700;
font-size:15px;
}

.time{
font-size:12px;
color:var(--sub);
}

.verify{
color:#38bdf8;
font-size:14px;
}

.post-text{
font-size:15px;
line-height:1.5;
word-break:break-word;
margin-bottom:12px;
}

.post img{
width:100%;
border-radius:20px;
max-height:420px;
object-fit:cover;
margin-top:10px;
border:1px solid #1e293b;
}

.post-bottom{
display:flex;
gap:10px;
margin-top:15px;
}

.action-btn{
flex:1;
padding:12px;
border-radius:14px;
background:#172033;
color:white;
}

.action-btn:hover{
background:#243041;
}

.like-btn.active{
background:#1d4ed8;
}

.delete-btn{
background:#3b1111;
color:#fca5a5;
}

.delete-btn:hover{
background:#521515;
}

/* PROFILE */

.profile-card{
background:rgba(15,23,42,.85);
border:1px solid var(--line);
padding:25px;
border-radius:26px;
max-width:450px;
margin:auto;
}

.profile-avatar{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
margin:auto;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:800;
margin-bottom:15px;
}

.profile-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:14px;
background:#0b1220;
color:white;
margin-top:10px;
}

.auth-btn{
margin-top:10px;
width:100%;
padding:14px;
border-radius:14px;
background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.logout{
background:#7f1d1d;
color:white;
}

/* MOBILE */

@media(max-width:800px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
flex-direction:row;
justify-content:space-around;
padding:12px;
border-right:none;
border-bottom:1px solid var(--line);
}

.logo{
display:none;
}

.main{
padding:14px;
}

}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">🐔 CGSocial</div>

<div class="menu-item" onclick="showFeed()">🏠 Feed</div>
<div class="menu-item" onclick="showProfile()">👤 Perfil</div>

</div>

<div class="main">

<!-- FEED -->

<div id="feedView">

<div class="topbar">
<h2>Inicio</h2>
<div class="status" id="status">Modo Invitado</div>
</div>

<div id="postBox" class="create-post" style="display:none;">

<textarea id="postInput" placeholder="¿Qué está pasando?"></textarea>

<div class="post-actions">

<label class="file-label">
📷 Imagen
<input type="file" id="imgPost" accept="image/*">
</label>

<button class="publish" onclick="addPost()">
Publicar
</button>

</div>

</div>

<div class="feed-grid" id="feed"></div>

</div>

<!-- PROFILE -->

<div id="profileView" style="display:none;">

<div class="profile-card">

<div class="profile-avatar" id="profileAvatar">
?
</div>

<h2 style="text-align:center;margin-bottom:15px;">Perfil</h2>

<div id="guestPanel">

<input id="email" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña">
<input id="username" placeholder="Nombre">

<button class="auth-btn" onclick="register()">
Crear cuenta
</button>

<button class="auth-btn" onclick="login()">
Iniciar sesión
</button>

</div>

<div id="userPanel" style="display:none;">

<input type="file" id="profileImg" accept="image/png,image/jpeg,image/webp">

<button class="auth-btn" onclick="changeProfile()">
Cambiar foto
</button>

<button class="auth-btn logout" onclick="logout()">
Cerrar sesión
</button>

</div>

</div>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyArVnNFSKQJJ0aWxblU7DtS_pGO4RJlZqk",
authDomain:"cgsocial.firebaseapp.com",
projectId:"cgsocial"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

/* DATA */

let userData=null;

const OWNER_UID="TU_UID";

/* VIEWS */

function showFeed(){
feedView.style.display="block";
profileView.style.display="none";
}

function showProfile(){
feedView.style.display="none";
profileView.style.display="block";
}

/* TIME */

function tiempo(t){

let diff=Math.max(0,Math.floor((Date.now()-t)/1000));

if(diff<60)return diff+"s";
if(diff<3600)return Math.floor(diff/60)+" min";
if(diff<86400)return Math.floor(diff/3600)+" h";
if(diff<31536000)return Math.floor(diff/86400)+" d";

return Math.floor(diff/31536000)+" a";

}

/* ESCAPE */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

/* REGISTER */

async function register(){

try{

let emailValue=email.value.trim();
let passValue=password.value.trim();
let nameValue=username.value.trim();

if(!emailValue||!passValue||!nameValue){
return alert("Completa todo");
}

let snap=await db.collection("users").get();

let exists=snap.docs.some(d=>
d.data().username.toLowerCase()===nameValue.toLowerCase()
);

if(exists){
return alert("Nombre en uso");
}

let cred=await auth.createUserWithEmailAndPassword(
emailValue,
passValue
);

await db.collection("users").doc(cred.user.uid).set({
username:nameValue,
photo:null
});

alert("Cuenta creada");

}catch(e){
alert(e.message);
}

}

/* LOGIN */

async function login(){

try{

await auth.signInWithEmailAndPassword(
email.value,
password.value
);

}catch(e){
alert(e.message);
}

}

/* LOGOUT */

function logout(){
auth.signOut();
}

/* PROFILE */

async function changeProfile(){

let file=profileImg.files[0];

if(!file)return;

if(file.size > 1024*1024*2){
return alert("Máximo 2MB");
}

let reader=new FileReader();

reader.onload=async e=>{

let base64=e.target.result;

await db.collection("users").doc(auth.currentUser.uid).update({
photo:base64
});

userData.photo=base64;

updateProfileAvatar();

alert("Foto actualizada");

};

reader.readAsDataURL(file);

}

/* SESSION */

auth.onAuthStateChanged(async user=>{

if(user){

let doc=await db.collection("users").doc(user.uid).get();

userData=doc.data();

status.innerHTML=`Conectado como <b>${userData.username}</b>`;

postBox.style.display="block";

guestPanel.style.display="none";
userPanel.style.display="block";

updateProfileAvatar();

}else{

status.textContent="Modo Invitado";

postBox.style.display="none";

guestPanel.style.display="block";
userPanel.style.display="none";

profileAvatar.innerHTML="?";

}

});

/* PROFILE AVATAR */

function updateProfileAvatar(){

if(!userData)return;

profileAvatar.innerHTML=userData.photo
? `<img src="${userData.photo}">`
: userData.username.charAt(0).toUpperCase();

}

/* COMPRESS */

function compressImage(file){

return new Promise(resolve=>{

let reader=new FileReader();

reader.onload=e=>{

let img=new Image();

img.src=e.target.result;

img.onload=()=>{

let canvas=document.createElement("canvas");

let max=900;

let scale=Math.min(1,max/img.width,max/img.height);

canvas.width=img.width*scale;
canvas.height=img.height*scale;

let ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,canvas.width,canvas.height);

resolve(
canvas.toDataURL("image/jpeg",0.75)
);

};

};

reader.readAsDataURL(file);

});

}

/* ADD POST */

async function addPost(){

if(!auth.currentUser){
return alert("Inicia sesión");
}

let text=postInput.value.trim();

let file=imgPost.files[0];

if(!text && !file){
return alert("Publicación vacía");
}

let img=null;

if(file){

if(file.size > 1024*1024*4){
return alert("Máximo 4MB");
}

img=await compressImage(file);

}

await db.collection("posts").add({

user:userData.username,
text:text,
img:img,
likes:0,
time:Date.now(),
uid:auth.currentUser.uid,
photo:userData.photo||null

});

postInput.value="";
imgPost.value="";

}

/* LIKE */

function likePost(id){

if(!auth.currentUser){
return alert("Inicia sesión");
}

db.collection("posts").doc(id).update({
likes:firebase.firestore.FieldValue.increment(1)
});

}

/* DELETE */

function deletePost(id,uid){

if(!auth.currentUser)return;

if(
auth.currentUser.uid===uid ||
auth.currentUser.uid===OWNER_UID
){

db.collection("posts").doc(id).delete();

}

}

/* FEED */

db.collection("posts")
.orderBy("time","desc")
.onSnapshot(snap=>{

feed.innerHTML="";

snap.forEach(doc=>{

let p=doc.data();

let avatar=p.photo
? `<img src="${p.photo}">`
: p.user.charAt(0).toUpperCase();

let verified=p.uid===OWNER_UID
? `<span class="verify">✔</span>`
: "";

feed.innerHTML+=`

<div class="post">

<div class="post-top">

<div class="avatar">
${avatar}
</div>

<div class="user-info">

<div class="username">
${escapeHTML(p.user)}
${verified}
</div>

<div class="time">
${tiempo(p.time)}
</div>

</div>

</div>

<div class="post-text">
${escapeHTML(p.text)}
</div>

${p.img ? `<img src="${p.img}">` : ""}

<div class="post-bottom">

<button class="action-btn like-btn"
onclick="likePost('${doc.id}')">

👍 ${p.likes}

</button>

${
auth.currentUser &&
(
auth.currentUser.uid===p.uid ||
auth.currentUser.uid===OWNER_UID
)

?

`

<button class="action-btn delete-btn"
onclick="deletePost('${doc.id}','${p.uid}')">

🗑️

</button>

`

:

""

}

</div>

</div>

`;

});

});

</script>

</body>
  </html>
