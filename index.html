<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CGSocial NEXT</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#060816;
  --card:#0f172aee;
  --soft:#111827;
  --line:#1e293b;
  --text:#ffffff;
  --sub:#94a3b8;
  --accent:#f59e0b;
  --accent2:#fb923c;
  --danger:#ef4444;
  --like:#2563eb;
  --radius:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter",sans-serif;
  -webkit-tap-highlight-color:transparent;
  scrollbar-width:thin;
  scrollbar-color:#243041 transparent;
}

html{
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    radial-gradient(circle at top left,#1e293b 0%,transparent 30%),
    radial-gradient(circle at bottom right,#172554 0%,transparent 35%),
    var(--bg);
  color:var(--text);
  display:flex;
}

.sidebar{
  width:240px;
  flex-shrink:0;
  background:rgba(10,15,30,.72);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,.05);
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}

.logo{
  font-size:28px;
  font-weight:800;
  padding:8px 10px 18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.menu-item{
  padding:14px 16px;
  border-radius:18px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  color:#dbe4f0;
  transition:.18s;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-item:hover{
  background:#1e293b;
  transform:translateX(3px);
}

.main{
  flex:1;
  min-height:100vh;
  overflow-y:visible;
  overflow-x:hidden;
  padding:24px;
  scroll-behavior:smooth;
}

.main::-webkit-scrollbar,
.sidebar::-webkit-scrollbar{
  width:10px;
}

.main::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb{
  background:#243041;
  border-radius:20px;
}

.main::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track{
  background:transparent;
}

.topbar{
  width:100%;
  max-width:760px;
  margin:auto auto 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.title{
  font-size:30px;
  font-weight:800;
}

.status{
  font-size:13px;
  color:var(--sub);
  background:#101827;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.05);
}

.feed{
  width:100%;
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:22px;
  padding-bottom:160px;
}

.create-post{
  background:var(--card);
  border:1px solid rgba(255,255,255,.05);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.create-top{
  display:flex;
  gap:12px;
}

textarea{
  width:100%;
  background:#0b1220;
  border:none;
  outline:none;
  color:white;
  padding:16px;
  border-radius:22px;
  resize:none;
  min-height:110px;
  font-size:15px;
  line-height:1.5;
}

textarea::placeholder{
  color:#7b8aa1;
}

.post-actions{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.left-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.file-label{
  background:#172033;
  padding:12px 16px;
  border-radius:16px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
}

.file-label:hover{
  background:#223049;
}

input[type=file]{
  display:none;
}

.publish{
  border:none;
  padding:13px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:black;
  transition:.18s;
}

.publish:hover{
  transform:scale(1.03);
}

#postsContainer{
  display:flex;
  flex-direction:column;
  gap:22px;
  padding-bottom:40px;
}

.post{
  background:var(--card);
  border:1px solid rgba(255,255,255,.05);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
  box-shadow:0 6px 26px rgba(0,0,0,.22);
  animation:show .22s ease;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-box{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.username{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.verify{
  color:#38bdf8;
  font-size:13px;
  margin-left:4px;
}

.time{
  font-size:12px;
  color:var(--sub);
}

.post-text{
  font-size:15px;
  line-height:1.6;
  word-break:break-word;
  color:#f8fafc;
  margin-top:4px;
}

.post-image{
  margin-top:14px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px 0;
}

.post-image img{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  object-fit:contain;
  background:#020617;
}

.post-image.square img{
  max-height:700px;
}

.post-image.vertical img{
  max-height:900px;
}

.post-image.horizontal img{
  max-height:560px;
}

.post-bottom{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.action-btn{
  flex:1;
  border:none;
  padding:12px;
  border-radius:16px;
  background:#172033;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.16s;
}

.action-btn:hover{
  background:#243041;
}

.delete-btn{
  background:#321313;
  color:#fca5a5;
}

.delete-btn:hover{
  background:#471717;
}

.profile-wrap{
  width:100%;
  max-width:500px;
  margin:auto;
}

.profile-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.05);
  border-radius:34px;
  padding:26px;
  backdrop-filter:blur(18px);
}

.profile-avatar{
  width:100px;
  height:100px;
  margin:auto auto 16px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:800;
  color:black;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:18px;
}

input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  outline:none;
  border-radius:18px;
  background:#0b1220;
  color:white;
  font-size:14px;
}

.auth-btn{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:black;
  transition:.18s;
}

.auth-btn:hover{
  transform:translateY(-1px);
}

.logout{
  background:#7f1d1d;
  color:white;
}

button,
.menu-item,
.file-label{
  touch-action:manipulation;
}

@media(max-width:900px){
  body{
    flex-direction:column;
  }

  .sidebar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:78px;
    z-index:1000;
    border-right:none;
    border-top:1px solid rgba(255,255,255,.05);
    padding:10px;
    flex-direction:row;
    justify-content:space-around;
    align-items:center;
    backdrop-filter:blur(24px);
  }

  .logo{
    display:none;
  }

  .menu-item{
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:12px;
    padding:10px;
    width:100%;
    height:58px;
    border-radius:18px;
    gap:4px;
  }

  .menu-item:hover{
    transform:none;
  }

  .main{
    padding:18px 14px 110px;
  }

  .topbar{
    margin-bottom:14px;
  }

  .title{
    font-size:24px;
  }

  .status{
    font-size:12px;
    padding:8px 12px;
  }

  .create-post{
    padding:14px;
    border-radius:26px;
  }

  textarea{
    font-size:14px;
    padding:14px;
    min-height:95px;
  }

  .post{
    padding:15px;
    border-radius:26px;
  }

  .post-image img{
    max-height:420px;
  }

  .profile-card{
    padding:22px;
    border-radius:28px;
  }
}

@media(max-width:500px){
  .main{
    padding-left:10px;
    padding-right:10px;
  }

  .feed{
    gap:18px;
  }

  .post{
    border-radius:24px;
  }

  .create-post{
    border-radius:24px;
  }

  .post-image img{
    max-height:360px;
  }

  textarea{
    min-height:88px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">CGSocial</div>
  <div class="menu-item" onclick="showFeed()">⌂ Feed</div>
  <div class="menu-item" onclick="showProfile()">◉ Perfil</div>
</div>

<div class="main">

  <div id="feedView">
    <div class="topbar">
      <div class="title">Inicio</div>
      <div class="status" id="status">Invitado</div>
    </div>

    <div class="feed">

      <div id="postBox" class="create-post" style="display:none;">
        <div class="create-top">
          <div class="avatar" id="miniAvatar">?</div>
          <textarea id="postInput" placeholder="¿Qué está pasando?"></textarea>
        </div>

        <div class="post-actions">
          <div class="left-actions">
            <label class="file-label">
              ✚ Imagen
              <input type="file" id="imgPost" accept="image/*">
            </label>
          </div>

          <button class="publish" onclick="addPost()">Publicar</button>
        </div>
      </div>

      <div id="postsContainer"></div>
    </div>
  </div>

  <div id="profileView" style="display:none;">
    <div class="profile-wrap">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-title">Perfil</div>

        <div id="guestPanel">
          <input id="email" placeholder="Correo">
          <input id="password" type="password" placeholder="Contraseña">
          <input id="username" placeholder="Nombre">

          <button class="auth-btn" onclick="register()">Crear cuenta</button>
          <button class="auth-btn" onclick="login()">Iniciar sesión</button>
        </div>

        <div id="userPanel" style="display:none;">
          <input type="file" id="profileImg" accept="image/png,image/jpeg,image/webp">
          <button class="auth-btn" onclick="changeProfile()">Cambiar foto</button>
          <button class="auth-btn logout" onclick="logout()">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyArVnNFSKQJJ0aWxblU7DtS_pGO4RJlZqk",
  authDomain:"cgsocial.firebaseapp.com",
  projectId:"cgsocial"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userData = null;
const OWNER_NAME = "TheRudyPlayer";

function showFeed(){
  feedView.style.display = "block";
  profileView.style.display = "none";
}

function showProfile(){
  feedView.style.display = "none";
  profileView.style.display = "block";
}

function tiempo(t){
  let diff = Math.max(0, Math.floor((Date.now() - t) / 1000));

  if(diff < 60) return diff + "s";

  if(diff < 3600){
    let m = Math.floor(diff / 60);
    return m + " min";
  }

  if(diff < 86400){
    let h = Math.floor(diff / 3600);
    return h + " h";
  }

  if(diff < 2592000){
    let d = Math.floor(diff / 86400);
    return d + " d";
  }

  if(diff < 31536000){
    let mo = Math.floor(diff / 2592000);
    return mo + (mo === 1 ? " mes" : " meses");
  }

  let y = Math.floor(diff / 31536000);
  return y + (y === 1 ? " año" : " años");
}

function escapeHTML(text){
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function setGuestStatus(){
  status.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="
        width:10px;
        height:10px;
        border-radius:50%;
        background:#f59e0b;
        box-shadow:0 0 10px #f59e0b;
      "></div>
      <span>Invitado</span>
    </div>
  `;
}

function setUserStatus(name){
  status.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="
        width:10px;
        height:10px;
        border-radius:50%;
        background:#22c55e;
        box-shadow:0 0 10px #22c55e;
      "></div>
      <span>${escapeHTML(name)}</span>
    </div>
  `;
}

async function register(){
  try{
    let emailValue = email.value.trim();
    let passValue = password.value.trim();
    let nameValue = username.value.trim();

    if(!emailValue || !passValue || !nameValue){
      return alert("Completa todo");
    }

    let snap = await db.collection("users").get();
    let exists = snap.docs.some(d => {
      let data = d.data();
      return data.username && data.username.toLowerCase() === nameValue.toLowerCase();
    });

    if(exists){
      return alert("Nombre en uso");
    }

    let cred = await auth.createUserWithEmailAndPassword(emailValue, passValue);

    await db.collection("users").doc(cred.user.uid).set({
      username: nameValue,
      photo: null
    });

    alert("Cuenta creada");
  }catch(e){
    alert(e.message);
  }
}

async function login(){
  try{
    await auth.signInWithEmailAndPassword(email.value, password.value);
  }catch(e){
    alert(e.message);
  }
}

function logout(){
  auth.signOut();
}

async function changeProfile(){
  let file = profileImg.files[0];
  if(!file) return;

  if(file.size > 1024 * 1024 * 2){
    return alert("Máximo 2MB");
  }

  let reader = new FileReader();

  reader.onload = async e => {
    let base64 = e.target.result;

    await db.collection("users").doc(auth.currentUser.uid).update({
      photo: base64
    });

    userData.photo = base64;
    updateAvatars();
    alert("Foto actualizada");
  };

  reader.readAsDataURL(file);
}

function updateAvatars(){
  if(!userData) return;

  let html = userData.photo
    ? `<img src="${userData.photo}">`
    : userData.username.charAt(0).toUpperCase();

  profileAvatar.innerHTML = html;
  miniAvatar.innerHTML = html;
}

auth.onAuthStateChanged(async user => {
  if(user){
    let doc = await db.collection("users").doc(user.uid).get();
    userData = doc.data();

    setUserStatus(userData.username);
    postBox.style.display = "block";
    guestPanel.style.display = "none";
    userPanel.style.display = "block";
    updateAvatars();
  }else{
    userData = null;
    setGuestStatus();
    postBox.style.display = "none";
    guestPanel.style.display = "block";
    userPanel.style.display = "none";
    profileAvatar.innerHTML = "?";
    miniAvatar.innerHTML = "?";
  }
});

function compressImage(file){
  return new Promise(resolve => {
    let reader = new FileReader();

    reader.onload = e => {
      let img = new Image();
      img.src = e.target.result;

      img.onload = () => {
        let canvas = document.createElement("canvas");
        let max = 1000;
        let scale = Math.min(1, max / img.width, max / img.height);

        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        let ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", 0.78));
      };
    };

    reader.readAsDataURL(file);
  });
}

function detectImageType(img, id){
  let box = document.getElementById(id);
  if(!box) return;

  let ratio = img.naturalWidth / img.naturalHeight;

  box.classList.remove("square", "vertical", "horizontal");

  if(ratio > 0.90 && ratio < 1.10){
    box.classList.add("square");
  }else if(ratio < 0.90){
    box.classList.add("vertical");
  }else{
    box.classList.add("horizontal");
  }
}

async function addPost(){
  if(!auth.currentUser){
    return alert("Inicia sesión");
  }

  let text = postInput.value.trim();
  let file = imgPost.files[0];

  if(!text && !file){
    return alert("Publicación vacía");
  }

  let img = null;

  if(file){
    if(file.size > 1024 * 1024 * 4){
      return alert("Máximo 4MB");
    }

    img = await compressImage(file);
  }

  await db.collection("posts").add({
    user: userData.username,
    text: text,
    img: img,
    likes: 0,
    time: Date.now(),
    uid: auth.currentUser.uid,
    photo: userData.photo || null
  });

  postInput.value = "";
  imgPost.value = "";
}

function likePost(id){
  if(!auth.currentUser){
    return alert("Inicia sesión");
  }

  db.collection("posts").doc(id).update({
    likes: firebase.firestore.FieldValue.increment(1)
  });
}

function deletePost(id, uid){
  if(!auth.currentUser) return;

  if(userData && userData.username === OWNER_NAME){
    db.collection("posts").doc(id).delete();
    return;
  }

  if(auth.currentUser.uid === uid){
    db.collection("posts").doc(id).delete();
    return;
  }

  alert("No puedes borrar esto");
}

db.collection("posts")
  .orderBy("time", "desc")
  .onSnapshot(snap => {
    postsContainer.innerHTML = "";

    snap.forEach(doc => {
      let p = doc.data();

      let avatar = p.photo
        ? `<img src="${p.photo}">`
        : p.user.charAt(0).toUpperCase();

      let verified = p.user === OWNER_NAME
        ? `<span class="verify">✓</span>`
        : "";

      postsContainer.innerHTML += `
        <div class="post">
          <div class="post-header">
            <div class="avatar">${avatar}</div>
            <div class="user-box">
              <div class="username">
                ${escapeHTML(p.user)}
                ${verified}
              </div>
              <div class="time">${tiempo(p.time)}</div>
            </div>
          </div>

          <div class="post-text">
            ${escapeHTML(p.text)}
          </div>

          ${
            p.img
              ? `
                <div class="post-image" id="img-${doc.id}">
                  <img src="${p.img}" onload="detectImageType(this,'img-${doc.id}')">
                </div>
              `
              : ""
          }

          <div class="post-bottom">
            <button class="action-btn" onclick="likePost('${doc.id}')">
              ♥ ${p.likes}
            </button>

            ${
              auth.currentUser &&
              (auth.currentUser.uid === p.uid || (userData && userData.username === OWNER_NAME))
                ? `
                  <button class="action-btn delete-btn" onclick="deletePost('${doc.id}','${p.uid}')">
                    ✕
                  </button>
                `
                : ""
            }
          </div>
        </div>
      `;
    });
  });

</script>

</body>
</html>
