<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CGSocial NEXT</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#060816;
  --card:#0f172aee;
  --soft:#111827;
  --line:#1e293b;
  --text:#ffffff;
  --sub:#94a3b8;
  --accent:#f59e0b;
  --accent2:#fb923c;
  --danger:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html{
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:
  radial-gradient(circle at top left,#1e293b 0%,transparent 30%),
  radial-gradient(circle at bottom right,#172554 0%,transparent 35%),
  var(--bg);
  color:white;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:240px;
  background:rgba(10,15,30,.72);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,.05);
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.logo{
  font-size:28px;
  font-weight:800;
  padding:8px 10px 18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.menu-item{
  padding:14px 16px;
  border-radius:18px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  color:#dbe4f0;
  transition:.18s;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-item:hover{
  background:#1e293b;
}

/* MAIN */

.main{
  flex:1;
  min-height:100vh;
  overflow-y:visible;
  overflow-x:hidden;
  padding:24px;
}

.topbar{
  width:100%;
  max-width:760px;
  margin:auto auto 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:30px;
  font-weight:800;
}

.status{
  font-size:13px;
  color:var(--sub);
  background:#101827;
  padding:10px 14px;
  border-radius:999px;
}

/* FEED */

.feed{
  width:100%;
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:22px;
  padding-bottom:160px;
}

.create-post{
  background:var(--card);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
}

.create-top{
  display:flex;
  gap:12px;
}

textarea{
  width:100%;
  background:#0b1220;
  border:none;
  outline:none;
  color:white;
  padding:16px;
  border-radius:22px;
  resize:none;
  min-height:110px;
  font-size:15px;
}

.post-actions{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.file-label{
  background:#172033;
  padding:12px 16px;
  border-radius:16px;
  font-size:14px;
  cursor:pointer;
}

input[type=file]{
  display:none;
}

.publish{
  border:none;
  padding:13px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:black;
}

/* POSTS */

#postsContainer,
#commentsContainer{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.post{
  background:var(--card);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-box{
  display:flex;
  flex-direction:column;
}

.username{
  font-size:15px;
  font-weight:700;
}

.verify{
  color:#38bdf8;
  margin-left:4px;
}

.time{
  font-size:12px;
  color:#94a3b8;
}

.post-text{
  font-size:15px;
  line-height:1.6;
  word-break:break-word;
}

.post-image{
  margin-top:14px;
  border-radius:24px;
  overflow:hidden;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px 0;
}

.post-image img{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  object-fit:contain;
}

.post-image.square img{
  max-height:700px;
}

.post-image.vertical img{
  max-height:900px;
}

.post-image.horizontal img{
  max-height:560px;
}

.post-bottom{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.action-btn{
  flex:1;
  border:none;
  padding:12px;
  border-radius:16px;
  background:#172033;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.delete-btn{
  background:#421818;
}

.profile-wrap{
  width:100%;
  max-width:500px;
  margin:auto;
}

.profile-card{
  background:var(--card);
  border-radius:34px;
  padding:26px;
}

.profile-avatar{
  width:100px;
  height:100px;
  margin:auto auto 16px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:800;
  color:black;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:18px;
}

input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  outline:none;
  border-radius:18px;
  background:#0b1220;
  color:white;
}

.auth-btn{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  border-radius:18px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:black;
}

.logout{
  background:#7f1d1d;
  color:white;
}

/* MOBILE */

@media(max-width:900px){

body{
  flex-direction:column;
}

.sidebar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  z-index:1000;
  border-right:none;
  border-top:1px solid rgba(255,255,255,.05);
  padding:10px;
  flex-direction:row;
  justify-content:space-around;
  align-items:center;
}

.logo{
  display:none;
}

.menu-item{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:12px;
  width:100%;
  height:58px;
}

.main{
  padding:18px 14px 110px;
}

.post-image img{
  max-height:420px;
}

}

</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">CGSocial</div>

  <div class="menu-item" onclick="showFeed()">
    ⌂ Feed
  </div>

  <div class="menu-item" onclick="showProfile()">
    ◉ Perfil
  </div>
</div>

<div class="main">

<!-- FEED -->

<div id="feedView">

  <div class="topbar">
    <div class="title">Inicio</div>
    <div class="status" id="status">Invitado</div>
  </div>

  <div class="feed">

    <div id="postBox" class="create-post" style="display:none;">

      <div class="create-top">

        <div class="avatar" id="miniAvatar">?</div>

        <textarea
        id="postInput"
        placeholder="¿Qué está pasando?"
        ></textarea>

      </div>

      <div class="post-actions">

        <label class="file-label">
          ✚ Imagen
          <input type="file" id="imgPost" accept="image/*">
        </label>

        <button class="publish" onclick="addPost()">
          Publicar
        </button>

      </div>

    </div>

    <div id="postsContainer"></div>

  </div>

</div>

<!-- COMMENTS -->

<div id="commentsView" style="display:none;">

  <div class="topbar">

    <div style="display:flex;align-items:center;gap:10px;">

      <button
      class="action-btn"
      style="width:50px;flex:none;"
      onclick="backToFeed()">
      ←
      </button>

      <div class="title">Comentarios</div>

    </div>

  </div>

  <div class="feed">

    <div id="singlePost"></div>

    <div class="create-post">

      <div class="create-top">

        <div class="avatar" id="commentAvatar">?</div>

        <textarea
        id="commentInput"
        placeholder="Escribe un comentario..."
        ></textarea>

      </div>

      <div class="post-actions">

        <button
        class="publish"
        onclick="sendComment()">
        Comentar
        </button>

      </div>

    </div>

    <div id="commentsContainer"></div>

  </div>

</div>

<!-- PROFILE -->

<div id="profileView" style="display:none;">

  <div class="profile-wrap">

    <div class="profile-card">

      <div class="profile-avatar" id="profileAvatar">?</div>

      <div class="profile-title">
        Perfil
      </div>

      <div id="guestPanel">

        <input id="email" placeholder="Correo">

        <input
        id="password"
        type="password"
        placeholder="Contraseña">

        <input
        id="username"
        placeholder="Nombre">

        <button class="auth-btn" onclick="register()">
          Crear cuenta
        </button>

        <button class="auth-btn" onclick="login()">
          Iniciar sesión
        </button>

      </div>

      <div id="userPanel" style="display:none;">

        <input
        type="file"
        id="profileImg"
        accept="image/png,image/jpeg,image/webp">

        <button
        class="auth-btn"
        onclick="changeProfile()">
        Cambiar foto
        </button>

        <button
        class="auth-btn logout"
        onclick="logout()">
        Cerrar sesión
        </button>

      </div>

    </div>

  </div>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey:"AIzaSyArVnNFSKQJJ0aWxblU7DtS_pGO4RJlZqk",
  authDomain:"cgsocial.firebaseapp.com",
  projectId:"cgsocial"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* VARIABLES */

let userData = null;

const OWNER_NAME = "TheRudyPlayer";

let currentPostId = null;

let unsubscribeComments = null;

/* VIEWS */

function showFeed(){

feedView.style.display = "block";
commentsView.style.display = "none";
profileView.style.display = "none";

}

function showProfile(){

feedView.style.display = "none";
commentsView.style.display = "none";
profileView.style.display = "block";

}

/* TIME */

function tiempo(t){

let diff = Math.floor((Date.now()-t)/1000);

if(diff < 60) return diff+"s";

if(diff < 3600)
return Math.floor(diff/60)+" min";

if(diff < 86400)
return Math.floor(diff/3600)+" h";

if(diff < 2592000)
return Math.floor(diff/86400)+" d";

if(diff < 31536000)
return Math.floor(diff/2592000)+" meses";

return Math.floor(diff/31536000)+" años";

}

/* ESCAPE */

function escapeHTML(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

/* STATUS */

function setGuestStatus(){

status.innerHTML = "Invitado";

}

function setUserStatus(name){

status.innerHTML = name;

}

/* REGISTER */

async function register(){

try{

let emailValue = email.value.trim();
let passValue = password.value.trim();
let nameValue = username.value.trim();

if(!emailValue || !passValue || !nameValue)
return alert("Completa todo");

let snap = await db.collection("users").get();

let exists = snap.docs.some(d=>{

let data = d.data();

return data.username &&
data.username.toLowerCase() ===
nameValue.toLowerCase();

});

if(exists)
return alert("Nombre en uso");

let cred =
await auth.createUserWithEmailAndPassword(
emailValue,
passValue
);

await db.collection("users")
.doc(cred.user.uid)
.set({

username:nameValue,
photo:null

});

alert("Cuenta creada");

}catch(e){

alert(e.message);

}

}

/* LOGIN */

async function login(){

try{

await auth.signInWithEmailAndPassword(
email.value,
password.value
);

}catch(e){

alert(e.message);

}

}

/* LOGOUT */

function logout(){

auth.signOut();

}

/* PROFILE PHOTO */

async function changeProfile(){

let file = profileImg.files[0];

if(!file) return;

let reader = new FileReader();

reader.onload = async e=>{

let base64 = e.target.result;

await db.collection("users")
.doc(auth.currentUser.uid)
.update({

photo:base64

});

userData.photo = base64;

updateAvatars();

alert("Foto actualizada");

};

reader.readAsDataURL(file);

}

/* UPDATE AVATARS */

function updateAvatars(){

if(!userData) return;

let html = userData.photo
? `<img src="${userData.photo}">`
: userData.username.charAt(0).toUpperCase();

profileAvatar.innerHTML = html;
miniAvatar.innerHTML = html;
commentAvatar.innerHTML = html;

}

/* SESSION */

auth.onAuthStateChanged(async user=>{

if(user){

let doc = await db.collection("users")
.doc(user.uid)
.get();

userData = doc.data();

setUserStatus(userData.username);

postBox.style.display = "block";

guestPanel.style.display = "none";

userPanel.style.display = "block";

updateAvatars();

}else{

userData = null;

setGuestStatus();

postBox.style.display = "none";

guestPanel.style.display = "block";

userPanel.style.display = "none";

}

});

/* COMPRESS IMAGE */

function compressImage(file){

return new Promise(resolve=>{

let reader = new FileReader();

reader.onload = e=>{

let img = new Image();

img.src = e.target.result;

img.onload = ()=>{

let canvas =
document.createElement("canvas");

let max = 1000;

let scale = Math.min(
1,
max/img.width,
max/img.height
);

canvas.width = img.width*scale;
canvas.height = img.height*scale;

let ctx = canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.78
)
);

};

};

reader.readAsDataURL(file);

});

}

/* IMAGE TYPE */

function detectImageType(img,id){

let box = document.getElementById(id);

if(!box) return;

let ratio =
img.naturalWidth/img.naturalHeight;

box.classList.remove(
"square",
"vertical",
"horizontal"
);

if(ratio > 0.90 && ratio < 1.10){

box.classList.add("square");

}else if(ratio < 0.90){

box.classList.add("vertical");

}else{

box.classList.add("horizontal");

}

}

/* ADD POST */

async function addPost(){

if(!auth.currentUser)
return alert("Inicia sesión");

let text = postInput.value.trim();

let file = imgPost.files[0];

if(!text && !file)
return alert("Publicación vacía");

let img = null;

if(file){

img = await compressImage(file);

}

await db.collection("posts")
.add({

user:userData.username,
text:text,
img:img,
likes:0,
time:Date.now(),
uid:auth.currentUser.uid,
photo:userData.photo || null

});

postInput.value = "";
imgPost.value = "";

}

/* LIKE */

function likePost(id){

if(!auth.currentUser)
return alert("Inicia sesión");

db.collection("posts")
.doc(id)
.update({

likes:firebase.firestore
.FieldValue.increment(1)

});

}

/* DELETE */

function deletePost(id,uid){

if(!auth.currentUser) return;

if(
userData &&
userData.username === OWNER_NAME
){

db.collection("posts")
.doc(id)
.delete();

return;

}

if(auth.currentUser.uid === uid){

db.collection("posts")
.doc(id)
.delete();

}

}

/* OPEN COMMENTS */

async function openComments(postId){

currentPostId = postId;

feedView.style.display = "none";
profileView.style.display = "none";
commentsView.style.display = "block";

let doc =
await db.collection("posts")
.doc(postId)
.get();

let p = doc.data();

if(!p) return;

let avatar = p.photo
? `<img src="${p.photo}">`
: p.user.charAt(0).toUpperCase();

let verified =
p.user === OWNER_NAME
? `<span class="verify">✓</span>`
: "";

singlePost.innerHTML = `

<div class="post">

<div class="post-header">

<div class="avatar">
${avatar}
</div>

<div class="user-box">

<div class="username">
${escapeHTML(p.user)}
${verified}
</div>

<div class="time">
${tiempo(p.time)}
</div>

</div>

</div>

<div class="post-text">
${escapeHTML(p.text)}
</div>

${
p.img

?

`
<div
class="post-image"
id="single-${postId}">
<img
src="${p.img}"
onload="
detectImageType(
this,
'single-${postId}'
)
">
</div>
`

:

""

}

</div>

`;

loadComments();

}

/* BACK */

function backToFeed(){

commentsView.style.display = "none";

showFeed();

}

/* SEND COMMENT */

async function sendComment(){

if(!auth.currentUser)
return alert("Inicia sesión");

let text =
commentInput.value.trim();

if(!text) return;

await db.collection("posts")
.doc(currentPostId)
.collection("comments")
.add({

user:userData.username,
photo:userData.photo || null,
text:text,
time:Date.now(),
uid:auth.currentUser.uid

});

commentInput.value = "";

}

/* LOAD COMMENTS */

function loadComments(){

if(unsubscribeComments){

unsubscribeComments();

}

unsubscribeComments =
db.collection("posts")
.doc(currentPostId)
.collection("comments")
.orderBy("time")
.onSnapshot(snap=>{

commentsContainer.innerHTML = "";

snap.forEach(doc=>{

let c = doc.data();

let avatar = c.photo
? `<img src="${c.photo}">`
: c.user.charAt(0).toUpperCase();

let verified =
c.user === OWNER_NAME
? `<span class="verify">✓</span>`
: "";

commentsContainer.innerHTML += `

<div class="post">

<div class="post-header">

<div class="avatar">
${avatar}
</div>

<div class="user-box">

<div class="username">
${escapeHTML(c.user)}
${verified}
</div>

<div class="time">
${tiempo(c.time)}
</div>

</div>

</div>

<div class="post-text">
${escapeHTML(c.text)}
</div>

</div>

`;

});

});

}

/* POSTS */

db.collection("posts")
.orderBy("time")
.onSnapshot(snap=>{

postsContainer.innerHTML = "";

let docs = snap.docs.reverse();

docs.forEach(doc=>{

let p = doc.data() || {};

let username = p.user || "Usuario";

let likes = p.likes || 0;

let time = p.time || Date.now();

let avatar = p.photo
? `<img src="${p.photo}">`
: username.charAt(0).toUpperCase();

let verified =
username === OWNER_NAME
? `<span class="verify">✓</span>`
: "";

postsContainer.innerHTML += `

<div class="post">

<div class="post-header">

<div class="avatar">
${avatar}
</div>

<div class="user-box">

<div class="username">
${escapeHTML(username)}
${verified}
</div>

<div class="time">
${tiempo(time)}
</div>

</div>

</div>

${
p.text

?

`
<div class="post-text">
${escapeHTML(p.text)}
</div>
`

:

""

}

${
p.img

?

`
<div
class="post-image"
id="img-${doc.id}">
<img
src="${p.img}"
onload="
detectImageType(
this,
'img-${doc.id}'
)
">
</div>
`

:

""

}

<div class="post-bottom">

<button
class="action-btn"
onclick="likePost('${doc.id}')">
♥ ${likes}
</button>

<button
class="action-btn"
onclick="openComments('${doc.id}')">
▣ Comentarios
</button>

${
auth.currentUser &&
(
auth.currentUser.uid === p.uid ||

(
userData &&
userData.username === OWNER_NAME
)

)

?

`
<button
class="action-btn delete-btn"
onclick="
deletePost(
'${doc.id}',
'${p.uid}'
)
">
✕
</button>
`

:

""

}

</div>

</div>

`;

});

});

</script>

</body>
</html>
