<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CGSocial NEXT</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#060816;
  --card:#0f172aee;
  --soft:#111827;
  --line:#1e293b;
  --text:#ffffff;
  --sub:#94a3b8;
  --accent:#f59e0b;
  --accent2:#fb923c;
  --danger:#ef4444;
  --like:#2563eb;
  --radius:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter",sans-serif;
  -webkit-tap-highlight-color:transparent;
  scrollbar-width:thin;
  scrollbar-color:#243041 transparent;
}

html{
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:
    radial-gradient(circle at top left,#1e293b 0%,transparent 30%),
    radial-gradient(circle at bottom right,#172554 0%,transparent 35%),
    var(--bg);
  color:var(--text);
  display:flex;
}

.sidebar{
  width:240px;
  flex-shrink:0;
  background:rgba(10,15,30,.72);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,.05);
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}

.logo{
  font-size:28px;
  font-weight:800;
  padding:8px 10px 18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.menu-item{
  padding:14px 16px;
  border-radius:18px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  color:#dbe4f0;
  transition:.18s;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-item:hover{
  background:#1e293b;
  transform:translateX(3px);
}

.main{
  flex:1;
  min-height:100vh;
  overflow-y:visible;
  overflow-x:hidden;
  padding:24px;
  scroll-behavior:smooth;
}

.main::-webkit-scrollbar,
.sidebar::-webkit-scrollbar{
  width:10px;
}

.main::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb{
  background:#243041;
  border-radius:20px;
}

.main::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track{
  background:transparent;
}

.topbar{
  width:100%;
  max-width:760px;
  margin:auto auto 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.title{
  font-size:30px;
  font-weight:800;
}

.status{
  font-size:13px;
  color:var(--sub);
  background:#101827;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.05);
}

.feed{
  width:100%;
  max-width:760px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:22px;
  padding-bottom:160px;
}

.create-post{
  background:var(--card);
  border:1px solid rgba(255,255,255,.05);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.create-top{
  display:flex;
  gap:12px;
}

textarea{
  width:100%;
  background:#0b1220;
  border:none;
  outline:none;
  color:white;
  padding:16px;
  border-radius:22px;
  resize:none;
  min-height:110px;
  font-size:15px;
  line-height:1.5;
}

textarea::placeholder{
  color:#7b8aa1;
}

.post-actions{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.left-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.file-label{
  background:#172033;
  padding:12px 16px;
  border-radius:16px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
}

.file-label:hover{
  background:#223049;
}

input[type=file]{
  display:none;
}

.publish{
  border:none;
  padding:13px 22px;
  border-radius:18px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:black;
  transition:.18s;
}

.publish:hover{
  transform:scale(1.03);
}

#postsContainer,
#commentsContainer{
  display:flex;
  flex-direction:column;
  gap:22px;
  padding-bottom:40px;
}

.post{
  background:var(--card);
  border:1px solid rgba(255,255,255,.05);
  border-radius:30px;
  padding:18px;
  backdrop-filter:blur(18px);
  box-shadow:0 6px 26px rgba(0,0,0,.22);
  animation:show .22s ease;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.post-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  overflow:hidden;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:black;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-box{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.username{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.verify{
  color:#38bdf8;
  font-size:13px;
  margin-left:4px;
}

.time{
  font-size:12px;
  color:var(--sub);
}

.post-text{
  font-size:15px;
  line-height:1.6;
  word-break:break-word;
  color:#f8fafc;
  margin-top:4px;
}

.post-image{
  margin-top:14px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px 0;
}

.post-image img{
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  object-fit:contain;
  background:#020617;
}

.post-image.square img{
  max-height:700px;
}

.post-image.vertical img{
  max-height:900px;
}

.post-image.horizontal img{
  max-height:560px;
}
  .post-bottom{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.action-btn{
  flex:1;
  border:none;
  padding:12px;
  border-radius:16px;
  background:#172033;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.16s;
}

.action-btn:hover{
  background:#243041;
}

.delete-btn{
  background:#321313;
  color:#fca5a5;
}

.delete-btn:hover{
  background:#471717;
}
  </script>

</body>
</html>
